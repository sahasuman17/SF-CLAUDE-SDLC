<template>
    <!-- Top-level container to center the card -->
    <div class="slds-grid slds-wrap slds-grid_align-center slds-p-around_medium">
        <!-- This div controls width: 2/3 of parent -->
        <div class="slds-col slds-size_2-of-3">
            <lightning-card title="Smart Sync Console" icon-name="custom:custom63">
                <div class="slds-m-around_medium">
                    <!-- Row 1: Connect to Data Cloud (Left aligned with 5rem left margin) -->
                    <div class="slds-m-bottom_medium">
                        <div style="margin-left: 8rem;">
                            <div style="display: flex; align-items: center; gap: 0.75rem;">
                                <span style="font-weight: 600;">Fetch Insights from Data Cloud</span>
                                <lightning-helptext
                                    content="Leverage this option for the first time and when there is a new insight in Data Cloud or the structure of the insight changed.">
                                </lightning-helptext>
                                <lightning-button
                                    label="Connect to Data Cloud"
                                    onclick={handleInitialize}
                                    variant="brand">
                                </lightning-button>
                            </div>
                        </div>
                    </div>

                    <!-- Row 2: Calculated Insights -->
                    <div class="slds-m-bottom_medium">
                        <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.2rem;">
                            <span style="font-weight: 600;">Calculated Insights</span>
                            <lightning-helptext
                                content="Choose a Calculated Insight and Click on Full Sync to Sync all records">
                            </lightning-helptext>
                        </div>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_2-of-3">
                                <lightning-combobox
                                    name="calculatedInsight"
                                    value={selectedInsight}
                                    options={calculatedInsightOptions}
                                    placeholder="Select an Insight"
                                    onchange={handleInsightChange}>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-3" style="margin-top: 1.25rem;">
                                <lightning-button
                                    variant="brand"
                                    label="Full Sync"
                                    title="Full Sync"
                                    onclick={handleFullSync}
                                    disabled={disableFullSync}
                                    class="slds-button_stretch"
                                    placeholder="Select a Primary key">
                                </lightning-button>
                            </div>
                        </div>
                    </div>


                    <!-- Row 3: Key Field -->
                    <div class="slds-m-bottom_medium">
                        <div class="slds-m-bottom_xx-small" style="display: flex; align-items: center; gap: 0.5rem;">
                            <span style="font-weight: 600;">Key Field</span>
                            <lightning-helptext
                                content="Please define your primary key to consider for incremental sync.">
                            </lightning-helptext>
                        </div>
                        <div class="slds-grid slds-wrap slds-gutters slds-align-end">
                            <div class="slds-col slds-size_2-of-3">
                                <lightning-combobox
                                    name="keyField"
                                    value={selectedKeyField}
                                    options={keyFieldOptions}
                                    onchange={handleKeyFieldChange}
                                    disabled={disableKeyField}>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-3" style="margin-top: 1.25rem;">
                                <lightning-button
                                    variant="brand"
                                    label="Incremental Sync"
                                    title="Incremental Sync"
                                    onclick={handleIncrementalSync}
                                    disabled={disableIncrementalSync}
                                    class="slds-button_stretch">
                                </lightning-button>
                            </div>
                        </div>
                    </div>

                    <!-- Row 4: Processing Phase + Status -->
                    <div class="slds-grid slds-wrap slds-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-2">
                            <p class="slds-text-title_caps slds-m-bottom_xx-small"><strong>Processing Phase</strong></p>
                            <p class="slds-text-body_regular">{processingPhase}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <p class="slds-text-title_caps slds-m-bottom_xx-small"><strong>Processing Status</strong></p>
                            <p class="slds-text-body_regular">{processingStatus}</p>
                        </div>
                    </div>
                    <!-- Row 5: Help + Processing Error -->
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-size_1-of-1">
                            <p class="slds-text-title_caps slds-m-bottom_xx-small"><strong>Help:</strong></p>
                            <p class="slds-text-body_regular">{helpMessage}</p>
                        </div>
                    </div>
                    <!-- Row 6:  Processing Error -->
                    <!--div class="slds-grid slds-wrap">
                        <template if:true={showProcessingError}>
                            <div class="slds-col slds-size_1-of-2">
                                <p class="slds-text-title_caps slds-m-bottom_xx-small"><strong>Processing Error:</strong></p>
                                <p class="slds-text-body_regular">{processingError}</p>
                            </div>
                        </template>
                    </div-->
                </div>
            </lightning-card>
        </div>
    </div>
</template>
