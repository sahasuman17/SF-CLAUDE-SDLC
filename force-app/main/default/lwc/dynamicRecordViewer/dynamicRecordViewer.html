<template>
    <lightning-card title="Calculated Insight">
        <div class="slds-p-horizontal_medium slds-p-vertical_small">
            <div class="slds-grid slds-gutters slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox
                        label="Calculated Insight"
                        value={selectedObjectName}
                        options={options}
                        onchange={handleObjectChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox
                        name="sortKeySelector"
                        label="Sort Key"
                        value={sortField}
                        options={columns}
                        onchange={handleSortKey}>
                    </lightning-combobox>
                </div>
            </div>
            <div class="slds-grid slds-gutters slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox
                        name="searchFieldSelector"
                        label="Search Key"
                        value={searchField}
                        options={columns}
                        onchange={handleSearchKey}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input
                        type="search"
                        label="Search"
                        value={searchTerm}
                        onchange={handleSearchChange}>
                    </lightning-input>
                </div>
            </div>
            <template if:true={error}>
                <div class="slds-text-color_error slds-m-bottom_small">{error}</div>
            </template>
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </template>
            <template if:true={hasRecords}>
                <!-- Total count now appears above the table -->
                <p class="slds-text-title_bold slds-m-bottom_small">{message}</p>

                <lightning-datatable
                    key-field="Id"
                    data={records}
                    columns={columns}
                    hide-checkbox-column
                    show-row-number-column>
                </lightning-datatable>

                <div class="slds-m-top_small slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                    <lightning-button label="Previous" onclick={handlePrevious} disabled={isPreviousDisabled}></lightning-button>
                    <div>Page {currentPage} of {totalPages}</div>
                    <lightning-button label="Next" onclick={handleNext} disabled={isNextDisabled}></lightning-button>
                </div>
            </template>

            <template if:false={hasRecords}>
                <p class="slds-text-color_weak">{message}</p>
            </template>
        </div>
    </lightning-card>
</template>
