<template>
    <lightning-input 
        type="search"
        label={label}
        value={searchKey}
        oninput={handleInput}
        placeholder={placeholder}>
    </lightning-input>

    <template if:true={results}>
        <ul class="slds-listbox slds-listbox_vertical slds-dropdown slds-dropdown_fluid">
            <template for:each={results} for:item="record">
                <li key={record.Id} 
                    class="slds-listbox__item"
                    onclick={handleSelect} 
                    data-id={record.Id}>
                    <div class="slds-media slds-listbox__option slds-listbox__option_plain">
                        <span class="slds-truncate">{record.Name}</span>
                    </div>
                </li>
            </template>
        </ul>
    </template>
</template>
