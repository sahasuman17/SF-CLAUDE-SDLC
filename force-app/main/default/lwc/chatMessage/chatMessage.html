<template>
    
    <div class="slds-chat-bookend fixed-header">
        <p><b>{toName}</b></p>
    </div>

    <div class="chatroom__messages">
        <template if:true={isTyping}>
            <div class="chatroom__typing-wrap slds-m-vertical_small">
                <div class="chatroom__typing">
                    <div class="chatroom__typing-line slds-m-horizontal_xx-small"></div>
                    <div class="chatroom__typing-line slds-m-horizontal_xx-small"></div>
                    <div class="chatroom__typing-line slds-m-horizontal_xx-small"></div>
                </div>
            </div>
        </template>
        
        <ul class="slds-p-around_medium slds-m-left_small">
            
                <li key={message.Id} class="slds-m-bottom_small">
                    <div class="slds-grid">
                       
                        <div class="slds-col slds-size_10-of-12 chatroom__content">
                            <p>{message}</p>
                        </div>
                    </div>
                </li>
            
        </ul>
    </div>

    <div class="fixed-footer">
        <div class="send-message-form slds-border_top">
            <input type="text" class="message-input" placeholder={inputPlaceholderText}>
        </div>
    </div>
</template>
