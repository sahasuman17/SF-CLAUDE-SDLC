<template>
  <div class="chatroom__messages">
   
   <template lwc:if={isNotListening}>
      
    
    </template>
    <template lwc:else>

       <h3 class="alignListeningText slds-p-around_medium">{initialText}</h3>
  </template>
  <section role="log" class="slds-chat">
    <ul class="slds-chat-list chat-request">
    </ul>
  </section>


  <section role="log" class="slds-chat">
    <ul class="slds-chat-list chat-response">
    </ul>
  </section>
  <template if:true={isTyping}>
    <div style="bottom:4rem;position:absolute;width:100%"  class="slds-align_absolute-center chatroom__typing-wrap slds-m-vertical_xx-small">
        <div class="chatroom__typing">
            <div class="chatroom__typing-line slds-m-horizontal_xx-small"></div>
            <div class="chatroom__typing-line slds-m-horizontal_xx-small"></div>
            <div class="chatroom__typing-line slds-m-horizontal_xx-small"></div>
        </div>
    </div>
  </template>
</div>

  <div class="slds-p-right_small slds-p-left_small slds-docked-form-footer"> 
    <div class="slds-is-relative innerDiv">
      <!--  <input type="text" oncustomclick={handleCustomClick} class="slds-textarea" 
    placeholder={inputPlaceholderText} value= {searchKey} onkeydown={handleKeyDown}/>-->
   <lightning-textarea oncustomclick={handleCustomClick} class="slds-textarea" variant="label-hidden"
        placeholder={inputPlaceholderText} value={searchKey} onkeydown={handleKeyDown}></lightning-textarea>
      <div onclick={doStop}>
        <lightning-icon icon-name="utility:stop" class="stopIcon slds-icon slds-icon_x-small slds-icon-text-default"
          aria-hidden="true" alternative-text="Click to say Something.." size="small" title="Stop">
        </lightning-icon>
      </div>
    <template lwc:if={isNotListening}>
      <div id="utilityNotListening" style="display:inline !important" class="alignOffMic slds-is-absolute" onclick={doAction}>
        <lightning-icon icon-name="utility:unmuted"  class="slds-icon slds-icon_x-small slds-icon-text-default" 
        aria-hidden="true" alternative-text="Click to say Something.." size="small" title="Not Listening">
        </lightning-icon>
        <!-- <lightning-icon icon-name="custom:custom35"  class="slds-icon slds-icon_x-small slds-icon-text-default" 
      aria-hidden="true" alternative-text="Click to stop" size="small" title="Listening">
      </lightning-icon> -->
      </div>
  </template>
  <template lwc:else>
    <div id="utilityListening" style="display:inline !important" class="slds-is-absolute alignOnMic" onclick={doAction}>
      <lightning-icon icon-name="custom:custom35"  class="slds-icon slds-icon-text-default" 
        aria-hidden="true" alternative-text="Click to say Something.." size="medium" title="Listening">
        </lightning-icon>
      <!-- <h3 class="slds-p-around_medium">Listening...........</h3> -->
      <!-- <lightning-icon icon-name="custom:custom35"  class="slds-icon slds-icon_large slds-icon-text-default" 
      aria-hidden="true" alternative-text="Click to stop" size="Large" title="Listening">
      </lightning-icon> -->
      <!-- <br/> -->
      
    </div>
  </template>
    </div>
    
  </div>   
</template>
