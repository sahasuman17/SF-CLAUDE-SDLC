<template>
    <lightning-card title="Please provide below details to raise a service request">
        <template for:each={fields} for:item="field">
            <div key={field.id} class="slds-m-around_medium">
                <lightning-input 
                    label={field.label} 
                    data-id={field.id} 
                    value={field.value} 
                    onchange={handleInputChange}>
                </lightning-input>
            </div>
        </template>
        <div class="slds-m-around_medium">
            <lightning-button label="Submit" onclick={handleSubmit} variant="brand"></lightning-button>
        </div>
    </lightning-card>
</template>
